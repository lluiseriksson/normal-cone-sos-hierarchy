[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normal-cone-sos-hierarchy"
version = "1.0.0"
description = "Exact-Q Sum-of-Squares Hierarchy on the Normal Cone of Q_2222: Rational Parameterization, Exact 4-Tier NPA Separation, and Visibility Optimality"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
